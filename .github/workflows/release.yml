name: Release

# Runs only when a version tag is pushed. It applies the same gates as CI, then creates the GitHub
# Release and publishes the packaged VSIX. Publishing steps are skipped when their token is not set.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package, release, publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
    env:
      HAS_OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN != '' }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tag must match the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Smoke-test the packaged VSIX
        run: |
          mkdir -p "$RUNNER_TEMP/vsix"
          unzip -q ./*.vsix -d "$RUNNER_TEMP/vsix"
          node -e "const { CDPHandler } = require(process.argv[1]); new CDPHandler(); console.log('VSIX loads its CDP handler')" \
            "$RUNNER_TEMP/vsix/extension/main_scripts/cdp-handler.js"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: '*.vsix'
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Antigravity Workflow Kit ${{ github.ref_name }}

            ### Installation
            1. Download the `.vsix` file below
            2. In Antigravity: `Cmd/Ctrl+Shift+P` → "Extensions: Install from VSIX..."
            3. Select the downloaded file

            ---

            ☕ **Support development**: [ko-fi.com/ai_dev_2024](https://ko-fi.com/ai_dev_2024)

      # Tokens are passed through the environment variables the tools read, never on the command line.
      - name: Publish to Open VSX
        if: env.HAS_OPENVSX_TOKEN == 'true'
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}
        run: npx --yes ovsx@1.4.0 publish ./*.vsix

      - name: Publish to VS Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath ./*.vsix
